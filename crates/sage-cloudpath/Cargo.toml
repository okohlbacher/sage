[package]
name = "sage-cloudpath"
version = "0.15.0-fork.4"
authors = ["Michael Lazear <michaellazear92@gmail.com"]
edition = "2021"
rust-version = "1.85"
description = "A very fast proteomics database search tool"
readme = "README.md"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0"
async-compression = { version = "0.3", features = ["tokio", "gzip", "zlib"] }
base64 = "0.13"
bytes = "1.0"
futures = "0.3"
log = "0.4.0"
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }
tokio = { version = "1.0", features = ["fs", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
quick-xml = { version = "0.31.0", features = ["async-tokio"] }
# already a quick-xml dependency: finds the spectrum boundaries for the parallel mzML parse
memchr = "2"
timsrust = { version = "0.4.2"}
# already a timsrust dependency: reads the PASEF table for the frame-once DDA reader
rusqlite = { version = "0.32", features = ["bundled"] }
# already a timsrust dependency: decodes .d frames read without a memory map
zstd = "0.13"
rayon = "1.5"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
regex = "1.6"
url = { version = "2", features = ["serde"]}
percent-encoding = "2"

serde = { version="1.0", features = ["derive"] }
serde_json = "1.0"

sage-core = { path = "../sage" }
parquet = { version = "50.0.0", optional = true, default-features = false, features = ["zstd"] }
# mzPeak input through the HUPO-PSI reference reader. Needs its `bruker` feature off
# (it would pull a second SQLite build next to timsrust's); that switch is not upstream
# yet: pinned to branch optional-bruker (tag sage-pin) of the okohlbacher/mzPeak fork
# until it is merged upstream (backlog: work/BACKLOG.md)
mzpeak_prototyping = { git = "https://github.com/okohlbacher/mzPeak", rev = "bfec73a2129efee970cd60b73e532dc9f9998ebb", default-features = false, optional = true }
mzdata = { version = "0.67.1", default-features = false, optional = true }

[features]
mzpeak = ["dep:mzpeak_prototyping", "dep:mzdata"]

[dev-dependencies]
flate2 = "1"
